[package]
name = "duir-tui"
description = "Terminal UI for duir hierarchical todo tree (txv-based)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "duir_tui"
path = "src/lib.rs"

[[bin]]
name = "duir-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
duir-core = { path = "../duir-core", default-features = false, features = ["crypto"] }
rusticle = { git = "https://github.com/rotmistrk/rusticle.git" }
txv-core = { path = "../../../kairn/txv/txv-core" }
txv-edit = { path = "../../../kairn/txv/txv-edit" }
txv-render = { path = "../../../kairn/txv/txv-render" }
txv-widgets = { path = "../../../kairn/txv/txv-widgets" }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"
